
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Toko Sriwijaya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <h2>Toko Sriwijaya</h2>
      <nav>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h2>Hubungi Kami</h2>
    <p style="text-align:center">
      Silakan isi formulir berikut untuk menghubungi Toko Sriwijaya.
    </p>

    <form class="card" onsubmit="alert('Terima kasih! Formulir contoh berhasil dicoba.'); return false;">
      <label for="nama">Nama lengkap</label>
      <input id="nama" name="nama" type="text"
        placeholder="Masukkan nama Anda" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email"
        placeholder="Masukkan email Anda" required>

      <label for="pesan">Pesan</label>
      <textarea id="pesan" name="pesan" rows="5"
        placeholder="Tulis pesan Anda" required></textarea>

      <button class="button" type="submit">Kirim Pesan</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Toko Sriwijaya</p>
  </footer>
</body>
</html>
